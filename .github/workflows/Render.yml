name: Render 2D Horror Animation

on:
  workflow_dispatch:
    inputs:
      fps:
        description: 'FPS (default 30)'
        required: false
        default: '30'
      chunk_size:
        description: 'Frames per chunk (default 500)'
        required: false
        default: '500'

# No timeout limit - max allowed for public repo is 360 minutes (6 hours)
# This is effectively no timeout for your ghost stories
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Install dependencies
        run: |
          echo "Installing dependencies (npm install)..."
          npm install --no-audit --no-fund
          echo "Node and Remotion installed"
          ls -lh node_modules/.bin/remotion || true

      - name: Prepare audio and timestamp
        run: |
          mkdir -p public out .chunks
          # Your files are in root as per requirement - copy to public for Remotion staticFile
          if [ -f "timestamp.json" ]; then cp timestamp.json public/timestamp.json; echo "Copied timestamp.json to public/"; fi
          if [ -f "Rizwan_story1.json" ]; then cp Rizwan_story1.json public/timestamp.json; echo "Copied Rizwan_story1.json to public/timestamp.json"; fi
          if [ -f "audio.mp3" ]; then cp audio.mp3 public/audio.mp3; echo "Copied audio.mp3 to public/"; fi
          if [ -f "public/timestamp.json" ]; then echo "timestamp.json found"; cat public/timestamp.json | head -c 500; fi
          ls -lh public/ || true

      - name: Calculate total frames from timestamp.json
        id: calc
        run: |
          node << 'NODE'
          const fs = require('fs');
          let totalFrames = 30 * 180; // default 3 min
          let durationSec = 180;
          try {
            const raw = fs.readFileSync('public/timestamp.json', 'utf-8');
            const data = JSON.parse(raw);
            let words = [];
            if(data.transcription) words = data.transcription;
            else if(Array.isArray(data) && data[0]?.word) words = data;
            else if(Array.isArray(data) && data[0]?.text) {
              // New format [{start,end,text}]
              const last = data[data.length-1];
              durationSec = Math.ceil(last.end + 2);
              totalFrames = Math.ceil(durationSec * 30);
              console.log(`New format detected: duration ${durationSec}s, frames ${totalFrames}`);
            }
            if(words.length){
              const last = words[words.length-1];
              const endMs = last.end_ms || last.end || 0;
              durationSec = Math.ceil(endMs/1000 + 2);
              totalFrames = Math.ceil(durationSec * 30);
              console.log(`Word format: ${words.length} words, duration ${durationSec}s, totalFrames ${totalFrames}`);
            }
          } catch(e){
            console.log('Could not parse timestamp.json, using default', e.message);
          }
          fs.writeFileSync('total_frames.txt', String(totalFrames));
          console.log(`::set-output name=total_frames::${totalFrames}`);
          // Also set env for next steps
          const core = require('fs');
          core.appendFileSync(process.env.GITHUB_ENV, `TOTAL_FRAMES=${totalFrames}
`);
          core.appendFileSync(process.env.GITHUB_ENV, `DURATION_SEC=${durationSec}
`);
          console.log(`TOTAL_FRAMES=${totalFrames}`);
          NODE
          echo "Total frames: $TOTAL_FRAMES"
          cat total_frames.txt

      - name: Render video in 500-frame chunks (no timeout, artifact per chunk)
        run: |
          set -e
          TOTAL=$(cat total_frames.txt)
          CHUNK_SIZE=${{ github.event.inputs.chunk_size || 500 }}
          echo "Rendering $TOTAL frames in chunks of $CHUNK_SIZE"
          
          # Function to render chunk
          render_chunk() {
            local START=$1
            local END=$2
            local CHUNK_FILE="out/chunk_${START}_${END}.mp4"
            echo "=== Rendering frames $START-$END -> $CHUNK_FILE ==="
            npx remotion render Composition "$CHUNK_FILE" --frames=$START-$END --codec=h264 --image-format=jpeg --concurrency=1 --overwrite --log=verbose || {
              echo "Chunk $START-$END failed, retrying once..."
              sleep 2
              npx remotion render Composition "$CHUNK_FILE" --frames=$START-$END --codec=h264 --image-format=jpeg --concurrency=1 --overwrite
            }
            echo "Chunk $START-$END done: $(du -h $CHUNK_FILE | cut -f1)"
            # Create marker for artifact upload tracking
            echo "$START-$END" >> .chunks/completed.txt
            ls -lh out/
          }
          
          mkdir -p out .chunks
          echo "" > .chunks/completed.txt
          
          # Loop through chunks
          START=0
          while [ $START -lt $TOTAL ]; do
            END=$((START + CHUNK_SIZE - 1))
            if [ $END -ge $TOTAL ]; then END=$((TOTAL - 1)); fi
            render_chunk $START $END
            START=$((END + 1))
            # Free memory
            echo "Memory after chunk: $(free -h | grep Mem)"
          done
          
          echo "All chunks rendered:"
          ls -lh out/
          cat .chunks/completed.txt

      - name: Upload all chunks as artifact (every 500 frames)
        uses: actions/upload-artifact@v4
        with:
          name: video-chunks-500frames-each
          path: out/chunk_*.mp4
          retention-days: 7
          if-no-files-found: error

      - name: Upload chunk completion log
        uses: actions/upload-artifact@v4
        with:
          name: render-log
          path: .chunks/completed.txt
          retention-days: 7

      - name: Stitch chunks into final video
        run: |
          set -e
          echo "Creating concat list..."
          # Create concat file for ffmpeg
          rm -f out/concat.txt
          for f in $(ls out/chunk_*.mp4 | sort -V); do
            echo "file '$(pwd)/$f'" >> out/concat.txt
          done
          echo "Concat list:"
          cat out/concat.txt
          
          echo "Stitching with ffmpeg..."
          ffmpeg -f concat -safe 0 -i out/concat.txt -c copy out/final_raw.mp4
          
          echo "Re-encoding final for compatibility..."
          ffmpeg -i out/final_raw.mp4 -c:v libx264 -c:a aac -movflags +faststart out/final.mp4 -y
          
          echo "Final video info:"
          ffprobe -v error -show_entries stream=codec_name,duration,bit_rate -of default out/final.mp4 || true
          ls -lh out/final.mp4 out/final_raw.mp4
          
          # Also create vertical version info
          echo "Final video ready: out/final.mp4"

      - name: Upload final stitched video
        uses: actions/upload-artifact@v4
        with:
          name: final-video-full
          path: out/final.mp4
          retention-days: 30
          if-no-files-found: error

      - name: Push final video to repo (optional)
        run: |
          set -e
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create videos folder if not exists
          mkdir -p videos
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          cp out/final.mp4 videos/final_${TIMESTAMP}.mp4
          cp out/final.mp4 final.mp4 || true
          
          # Add and commit if there are changes
          git add -f videos/final_${TIMESTAMP}.mp4 final.mp4 || true
          git add -f out/final.mp4 || true
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add rendered video ${TIMESTAMP} [skip ci]" || echo "Commit failed, maybe no changes"
            git push origin HEAD:${{ github.ref_name || 'main' }} || {
              echo "Push failed, trying main branch"
              git push origin HEAD:main || echo "Push failed - you may need to allow workflow to push (Settings -> Actions -> Workflow permissions -> Read and write)"
            }
          fi
          echo "Push attempt done"

      - name: Summary
        run: |
          echo "## Render Complete! 🎬" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Total frames: $TOTAL_FRAMES" >> $GITHUB_STEP_SUMMARY
          echo "- Duration: $DURATION_SEC seconds" >> $GITHUB_STEP_SUMMARY
          echo "- Chunks: $(ls out/chunk_*.mp4 | wc -l) x 500 frames" >> $GITHUB_STEP_SUMMARY
          echo "- Final video: out/final.mp4 ($(du -h out/final.mp4 | cut -f1))" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "- video-chunks-500frames-each: All 500-frame chunks" >> $GITHUB_STEP_SUMMARY
          echo "- final-video-full: Stitched full video" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "For your Lahuria ghost story, download final-video-full artifact!" >> $GITHUB_STEP_SUMMARY
